services:
  app:
    build: docker/dev          # PHP 8.4 + estensioni + composer
    image: deliveboo-php84
    working_dir: /app
    volumes:
      - .:/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    # the demo dataset has ~185k orders: the 128 MB default pool reads the disk on every report
    command: --innodb-buffer-pool-size=512M
    environment:
      MYSQL_DATABASE: deliveboo
      MYSQL_USER: deliveboo
      MYSQL_PASSWORD: local_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
