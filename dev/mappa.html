<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa del progetto</title>
<style>
:root{
  --bg:#0b0f14; --panel:#101d29; --panel-2:#152535; --line:rgba(110,180,210,.17);
  --accent:#00dccb; --blue:#1685ff; --amber:#f5b84b; --violet:#b18cff;
  --text:#f5f7fa; --muted:#aab8c7;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.92em;color:var(--accent);background:rgba(0,220,203,.08);padding:1px 5px;border-radius:5px}

/* ---------- tab bar ---------- */
.tabs{display:flex;gap:4px;align-items:flex-end;padding:10px 16px 0;background:#080b0f;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.brand{font-size:12px;letter-spacing:.04em;color:var(--muted);margin-right:16px;padding-bottom:10px;white-space:nowrap}
.brand b{color:var(--accent)}
.tab{position:relative;background:none;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:9px 18px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap;flex:none}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab[aria-selected="true"]{color:var(--text);background:var(--bg);border-color:var(--line);top:1px;box-shadow:0 2px 0 var(--bg)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:14px;right:14px;height:2px;border-radius:2px;background:var(--accent)}

/* ---------- panels ---------- */
main{flex:1;min-height:0;display:flex}
.panel{display:none;flex:1;min-width:0;min-height:0;overflow:auto}
.panel.is-active{display:block}
#panel-graph,#panel-links,#panel-cmd{padding:22px clamp(16px,3vw,40px) 48px}
#panel-links,#panel-cmd{padding-bottom:60px}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:22px;margin-bottom:6px}
h2{font-size:16px;margin:26px 0 10px}
.lead{max-width:78ch;color:var(--muted);margin-bottom:14px}
.golden{border:1px solid rgba(0,220,203,.35);background:rgba(0,220,203,.06);border-radius:12px;padding:12px 16px;max-width:90ch;margin:0 0 16px}
.golden b{color:var(--accent)}

/* ---------- graph ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 12px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid;display:inline-block}
.graph{border:1px solid var(--line);border-radius:14px;background:#0a1118;overflow-x:auto}
.graph svg{display:block;width:100%;min-width:980px;height:auto}
.node rect{stroke-width:1.5;transition:filter .15s,stroke-width .15s}
.node.go{cursor:pointer}
.node.go:hover rect,.node.go:focus rect{filter:brightness(1.35);stroke-width:2.5}
.node:focus{outline:none}
.node .t{font-size:15px;font-weight:600;fill:var(--text)}
.node .s{font-size:12px;fill:var(--muted)}
.edge{stroke:#5d7a92;stroke-width:1.6;fill:none}
.edge.dash{stroke-dasharray:6 5}
.elab{font-size:11.5px;fill:#cfe0ee;paint-order:stroke;stroke:#0a1118;stroke-width:5px;stroke-linejoin:round}
.glab{font-size:11px;font-weight:600;fill:#6f8aa0;letter-spacing:.08em;text-transform:uppercase}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;list-style:none;counter-reset:st}
.steps li{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 50px;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:13px;top:12px;width:25px;height:25px;border-radius:50%;background:rgba(0,220,203,.14);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}

/* ---------- code (explorer) ---------- */
#panel-code.is-active{display:grid;grid-template-columns:300px 1fr;overflow:hidden}
.side{background:#0d141b;border-right:1px solid var(--line);overflow:auto;min-height:0}
.side-h{position:sticky;top:0;z-index:1;background:#0d141b;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.side-h button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;letter-spacing:0;text-transform:none;cursor:pointer}
.side-h button:hover{color:var(--accent)}
.tree{list-style:none;padding:4px 0 24px}
.tree ul{list-style:none}
.it{display:flex;align-items:center;gap:6px;width:100%;padding:3px 10px 3px calc(10px + var(--d)*14px);font-size:13px;color:#cdd9e4;cursor:pointer;white-space:nowrap;user-select:none}
.it:hover{background:rgba(255,255,255,.05)}
.it[aria-current="true"]{background:rgba(0,220,203,.14);color:var(--text)}
.it:focus-visible{outline-offset:-2px}
.chev{width:10px;flex:none;font-size:9px;color:var(--muted);transition:transform .15s;text-align:center}
li[aria-expanded="true"]>.it .chev{transform:rotate(90deg)}
li[aria-expanded="false"]>ul{display:none}
.ico{width:15px;flex:none;text-align:center;font-family:var(--mono);font-size:10px;font-weight:700}
.nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.it.ghost .nm{opacity:.6;font-style:italic}
.bdg{font-size:10px;color:var(--muted);flex:none}
.main{overflow:auto;min-height:0;background:var(--bg)}
.crumb{position:sticky;top:0;z-index:1;background:#0b0f14ee;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:9px 28px;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow-x:auto}
.crumb a{cursor:pointer;text-decoration:none}
.crumb a:hover{color:var(--accent)}
.crumb b{color:var(--text)}
.doc{max-width:860px;padding:26px 28px 70px}
.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);margin-bottom:10px}
.doc h2.ttl{font-family:var(--mono);font-size:26px;margin:0 0 8px;word-break:break-word}
.one{font-size:17px;color:#e6eef6;margin-bottom:18px}
.doc h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:22px 0 8px}
.doc ul.pts{padding-left:20px}
.doc ul.pts li{margin:3px 0}
.example{background:#08101a;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:12.5px;color:#d7e6f3;white-space:pre-wrap;word-break:break-word}
.example .why{display:block;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;color:var(--muted);margin-top:6px;white-space:normal}
.example .why.solo{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-family:var(--mono);font-size:12px;color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.kids{display:flex;flex-direction:column;gap:6px}
.kids .chip{border-radius:10px;display:flex;justify-content:space-between;gap:14px;width:100%;text-align:left;padding:7px 12px}
.kids .chip small{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ---------- links ---------- */
.grid{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:stretch;margin:6px 0 8px}
.gh{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:0 2px}
.gt{font-weight:600;align-self:center}
.gt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.card{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-decoration:none;transition:border-color .15s,transform .15s;min-width:0}
a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .u{font-family:var(--mono);font-size:13px;color:var(--accent);word-break:break-all}
.card .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.card .ar{color:var(--muted);flex:none}
.card.is-na{opacity:.45;border-style:dashed}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:820px;accent-color:var(--accent)}
.composer fieldset{border:0;display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px}
.composer legend{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.composer label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.out{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#08101a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}
.out code{flex:1;min-width:200px;background:none;padding:0;word-break:break-all}
.btn{display:inline-block;background:rgba(0,220,203,.14);border:1px solid rgba(0,220,203,.4);color:var(--text);border-radius:8px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(0,220,203,.26)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.notes{border-left:3px solid var(--amber);padding-left:12px;margin-top:8px;color:#d9e2ea;max-width:100ch}
.notes h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--amber);margin:18px 0 6px}
.notes h3:first-child{margin-top:0}
.notes p{margin:4px 0}
.notes pre{background:#08101a;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:12.5px;color:#d7e6f3;white-space:pre-wrap;word-break:break-word;margin:6px 0 10px}

/* ---------- avvio (in cima a "Link di avvio") ---------- */
.boot-h,.boot-lead{text-align:center;margin-left:auto;margin-right:auto}
.boot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;max-width:1120px;margin:0 auto 8px}
.bootbox{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:16px 18px 18px;min-width:0}
.bootbox.is-blue{border-top-color:var(--blue)}
.boot-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.boot-t .pill{margin:0}
.bootbox h2{margin:0;font-size:17px}
.boot-sub{color:var(--muted);margin:6px 0 4px}
.bootbox h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:16px 0 6px}
.bootbox.is-blue h3{color:#6fb4ff}
.bootbox.is-blue .example{border-left-color:var(--blue)}
.bootbox .cmd{margin-bottom:8px}
.bootbox.is-start{max-width:1120px;margin:0 auto 8px;border-top-color:var(--violet);box-shadow:0 0 0 1px rgba(177,140,255,.18),0 10px 40px rgba(177,140,255,.08)}
.bootbox.is-start h3{color:var(--violet)}
.bootbox.is-start .example{border-left-color:var(--violet)}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.svc-i{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.svc-i .cmd{margin-bottom:0}
.svc-i h3:first-child{margin-top:0}
.svc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.svc-h small{color:var(--muted);font-size:12px;margin-left:auto}
.svc-n{width:24px;height:24px;border-radius:50%;background:rgba(177,140,255,.16);color:var(--violet);font-weight:700;display:grid;place-items:center;font-size:13px;flex:none}
.svc-all{margin-top:4px}
.boot-h2{margin-top:34px}
.after-start{margin-top:28px}
.boot-top{text-align:center;font-size:26px;margin:0 0 14px}
.login-top{max-width:1120px;margin:0 auto 18px;border:1px solid rgba(0,220,203,.45);background:rgba(0,220,203,.07)}
.login-top .login-who{color:var(--accent)}
.applink .env{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--violet);margin-bottom:2px}
.applink .u{font-size:14px}
.login{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:640px}
.login-who{font-weight:600;margin-bottom:8px}
.login-f{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.login-f span{width:76px;color:var(--muted);font-size:12.5px}
.login-f code{flex:1;min-width:180px;font-size:13.5px;padding:5px 9px}
.after-boot{margin-top:40px;padding-top:26px;border-top:1px solid var(--line)}

/* ---------- commands ---------- */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:6px}
.tools input[type=search]{flex:1;min-width:220px;background:#08101a;border:1px solid var(--line);border-radius:8px;padding:7px 11px;color:var(--text);font:inherit}
.tools input[type=search]:focus{border-color:var(--accent)}
.cmds{display:flex;flex-direction:column;gap:8px;max-width:1000px}
.cmd{display:flex;gap:10px;align-items:flex-start}
.cmd .example{flex:1;min-width:0}
.cmd.is-danger .example{border-left-color:var(--amber)}
.warn{color:var(--amber);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600}
.empty{color:var(--muted)}

/* ---------- pagamenti (estensione) ---------- */
#panel-pay{padding:22px clamp(16px,3vw,40px) 60px}
.pay-s{max-width:900px}
.pay-s{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:4px 18px 14px;margin-top:16px}
.pay-s.is-warn{border-top-color:var(--amber)}
.pay-s h2{margin:14px 0 8px}
.pay-s p{margin:0 0 8px;color:#e6eef6}
.pay-s .cmd{margin-bottom:10px}
.pay-steps{margin:0 0 6px 22px;color:#e6eef6}
.pay-steps li{margin-bottom:7px;padding-left:4px}
.pay-steps li::marker{color:var(--accent);font-weight:700}
.pay-go{font-size:12.5px;color:var(--muted)}
.pay-go a{color:var(--accent)}

/* ---------- carte di prova (estensione) ---------- */
#panel-test,#panel-style{padding:22px clamp(16px,3vw,40px) 60px}
.tc-check{max-width:900px}
.tc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-top:14px}
.tc-box{min-width:0}
.tc-cards{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tc-card{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tc-card code{flex:1;min-width:190px;font-size:15px;padding:5px 9px;letter-spacing:.04em}
.tc-l{width:150px;color:var(--muted);font-size:12.5px}
.tc-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.tc-dot.is-ok{background:rgba(0,220,203,.16);color:var(--accent)}
.tc-dot.is-ko{background:rgba(245,184,75,.16);color:var(--amber)}
.tc-rules{margin:0 0 4px 20px;color:#e6eef6}
.tc-rules li{margin-bottom:6px}
.tc-out{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:12px 18px 14px}
.tc-out.is-ko{border-top-color:var(--amber)}
.tc-out h3{font-size:15px;margin-bottom:6px}
.tc-out.is-ok h3{color:var(--accent)}
.tc-out.is-ko h3{color:var(--amber)}
.tc-out p{color:#e6eef6}

/* ---------- stile e brand (estensione): i colori dei campioni arrivano dai dati ---------- */
@font-face{font-family:"Bricolage Grotesque";font-weight:400 800;font-display:swap;src:url("../resources/fonts/bricolage-grotesque-latin.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:400 800;font-display:swap;src:url("../resources/fonts/figtree-latin.woff2") format("woff2")}
.st-concept{max-width:900px}
.st-words{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.st-words .pill{margin:0}
.st-gd{margin-bottom:8px}
.st-pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:10px}
.st-sw{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.st-chip{width:64px;height:64px;border-radius:10px;border:1px solid rgba(255,255,255,.16)}
.st-sw-b{min-width:0}
.st-sw-b p{font-size:12.5px;color:#d7e6f3;margin-top:4px}
.st-hex{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.st-font{margin-top:0}
.st-sample{background:#faf8f4;color:#1c1a17;border-radius:10px;padding:18px 18px 16px;margin:14px 0 10px;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.st-font h3{font-size:15px;margin-bottom:4px}

/* ---------- relazioni tra le tabelle (estensione) ---------- */
#panel-db{padding:22px clamp(16px,3vw,40px) 60px}
.rline{display:inline-block;width:22px;height:0;border-top:2px solid var(--c)}
.rnone{color:var(--muted);font-style:normal}
.dbn .t{font-family:var(--mono)}
.redge{stroke-width:2;fill:none}
.ccard{font-size:13px;font-weight:700;font-family:var(--mono);paint-order:stroke;stroke:#0a1118;stroke-width:5px;stroke-linejoin:round}
.rsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:8px}
.rsum-i{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:9px 12px;text-align:left;font:inherit;color:var(--text);cursor:pointer}
.rsum-i:hover{border-top-color:var(--accent);border-right-color:var(--accent);border-bottom-color:var(--accent)}
.rsum-i .rtype{grid-row:span 2}
.rsum-i small{color:var(--muted);font-size:12px}
.rsum-d{font-size:12.5px;color:var(--muted)}
.rtype{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 9px;white-space:nowrap}
.rels{display:flex;flex-direction:column;gap:14px}
.rel{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:14px 16px 16px;scroll-margin-top:16px}
.rel header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rel h3{font-family:var(--mono);font-size:16px}
.rsay{color:#e6eef6;margin:6px 0 12px}
.rdia{display:flex;align-items:center;overflow-x:auto;padding-bottom:4px}
.tbox{flex:1 1 0;min-width:190px;background:var(--f);border:1.5px solid var(--s);border-radius:10px;overflow:hidden}
.tbox-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;color:var(--text);font:inherit;cursor:pointer;text-align:left}
.tbox-h span{font-family:var(--mono);font-weight:700}
.tbox-h small{color:var(--muted);font-size:11.5px;text-align:right}
.tbox-h:hover span{color:var(--accent)}
.tcols{list-style:none;padding:4px 0}
.tcols li{display:flex;justify-content:space-between;gap:8px;padding:2px 10px;font-family:var(--mono);font-size:12.5px;color:#d7e6f3}
.tcols li.is-key{background:rgba(0,220,203,.08);color:var(--text)}
.ctag{font-style:normal;font-size:10.5px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--muted);white-space:nowrap}
.ctag.pk{color:var(--amber)}
.ctag.fk{color:var(--accent)}
.rlink{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 8px;text-align:center}
.rcard{display:flex;align-items:center;width:100%;gap:6px;color:var(--c);font-family:var(--mono);font-size:15px}
.rcard i{flex:1;border-top:2px solid var(--c)}
.rlink code{font-size:11px;word-break:break-word}

const BOOT = {"title": "Avviare Foodsy", "lead": "Per lavorare servono <b>tre server</b> accesi: il database MySQL e Laravel girano nei container Docker, Vite gira nel terminale e ricompila <code>resources/</code> in <code>public/build</code>. I comandi sono gli stessi nel Codespace e su un PC: cambia solo l'indirizzo da aprire.", "start": {"tag": "ogni giorno", "title": "Avvia tutti i server di sviluppo", "sub": "Un comando per terminale, in quest'ordine. Non serve nessun altro processo: la coda è `sync` e il broadcast è `log`.", "services": [{"n": "1", "h": "Database · MySQL 8", "port": "3306, solo tra container", "c": "docker compose up -d db", "d": "Container `db`, dati nel volume `mysql_data`. Aspetta che `docker compose ps` lo mostri “healthy”."}, {"n": "2", "h": "Back-end · Laravel", "port": "porta 8000", "c": "docker compose up -d app", "d": "Container `app`: `php artisan serve` su 0.0.0.0:8000. Parte solo quando il database è pronto, quindi `docker compose up -d` da solo avvia 1 e 2 insieme."}, {"n": "3", "h": "Front-end · Vite", "port": "terminale 2, resta aperto", "c": "npm run watch", "d": "Ricompila `public/build` a ogni salvataggio (`vite build --watch`); poi basta ricaricare la pagina. Ctrl+C per fermarlo."}], "all": {"h": "Tutto in un colpo", "c": "docker compose up -d && docker compose ps && npm run watch", "d": "Avvia db e Laravel, mostra lo stato, poi lascia Vite in primo piano."}, "urls": [{"env": "Codespace (adesso)", "href": "https://fictional-fiesta-7x7qvp47r95fgq6-8000.app.github.dev", "d": "Porta privata: si apre nel browser con cui sei entrato in GitHub. Se il Codespace cambia, l'indirizzo giusto lo stampa `echo \"https://$CODESPACE_NAME-8000.app.github.dev\"` (o pannello Ports, porta 8000)."}, {"env": "PC locale", "href": "http://127.0.0.1:8000", "d": "Funziona solo con i server accesi su quel computer."}], "extra": [{"h": "Facoltativo · log in diretta (terzo terminale)", "c": "docker compose logs -f app\ntail -f storage/logs/laravel.log", "d": "Richieste al server; errori 500 ed email quando `MAIL_MAILER=log`."}, {"h": "Spegnere tutto", "c": "docker compose stop", "d": "Ferma db e Laravel senza cancellare dati; Vite si chiude con Ctrl+C."}], "login": {"title": "Entra come ristoratore", "who": "Federico Romiti · 33 ristoranti (i 3 storici: the garage, Burger King, Mc Donald's)", "email": "restaurant_owner@foodsy.test", "password": "12345678", "path": "/login", "d": "Dopo il login vai su `/admin`: piatti, ordini e statistiche dei suoi ristoranti. Account di prova dei seeder, non dati veri. Gli altri account demo (config/demo.php, box nella pagina di login): admin `admin@foodsy.test` / `foodsy-admin` → `/platform`; cliente Mario Rossi `customer@foodsy.test` / `foodsy-demo` → sito."}}, "setupTitle": "Prima installazione (una volta sola)", "boxes": [{"tag": "adesso", "title": "Codespace", "color": "accent", "sub": "Questo Codespace è già configurato (`.env`, `vendor/`, immagine Docker): di solito non serve niente. Solo in questi casi:", "steps": [{"h": "Dopo la migrazione a Laravel 13 (una volta)", "c": "docker compose build && docker compose up -d && docker compose exec app php artisan migrate", "d": "Ricrea il container `app` con PHP 8.4 (`deliveboo-php84`: Laravel 13 non gira su 8.0) e aggiunge solo la migration `2026_11_22_000000_restore_price_column_types`. Non tocca i dati: niente seed, niente `fresh`."}, {"h": "Manca node_modules/", "c": "npm install", "d": ""}, {"h": "Database vuoto", "c": "docker compose exec app php artisan migrate --seed", "d": "Primo avvio o dopo `docker compose down -v`. Si può rilanciare: i seeder non duplicano."}, {"h": "Codespace nuovo o ricostruito", "c": "", "d": "Segui il riquadro accanto dal passo `cp .env.example .env` (il clone c'è già)."}]}, {"tag": "futuro", "title": "PC senza Codespace", "color": "blue", "sub": "Serve solo: Git, Docker Desktop (o Docker Engine + compose) e Node 20.19 o superiore. PHP, Composer e MySQL girano nei container.", "steps": [{"h": "Scarica e configura", "c": "git clone <url-del-repo> deliveBoo && cd deliveBoo\ncp .env.example .env", "d": "Poi in `.env` imposta queste righe (sono i valori di `docker-compose.yml`):"}, {"h": "", "c": "DB_HOST=db\nDB_DATABASE=deliveboo\nDB_USERNAME=deliveboo\nDB_PASSWORD=local_password\nMAIL_MAILER=log\nAPP_URL=http://127.0.0.1:8000", "d": "Su Windows usa il terminale di WSL o Git Bash."}, {"h": "Back-end", "c": "docker compose build\ndocker compose run --rm app composer install\ndocker compose run --rm app php artisan key:generate\ndocker compose up -d\ndocker compose exec app php artisan migrate --seed", "d": "`build` crea l'immagine PHP 8.4 da `docker/dev/Dockerfile`. `composer install` va fatto con `run` prima di `up`: senza `vendor/` il server non parte."}, {"h": "Front-end", "c": "npm install", "d": "Vite 8 richiede Node 20.19 o superiore. Da qui in poi usa il riquadro “Avvia tutti i server”."}, {"h": "Dopo un git pull che cambia Docker o migration", "c": "docker compose build && docker compose up -d && docker compose exec app php artisan migrate", "d": "Ricostruisce l'immagine PHP se `docker/dev/Dockerfile` è cambiato, riavvia i container ed esegue solo le migration nuove, senza perdere dati."}]}]};

const NOTES = [{"title": "Docker: controllare e spegnere", "items": [{"code": "docker compose ps             # stato dei container\ndocker compose logs -f app    # log del server (Ctrl+C per uscire)\ndocker compose exec app bash  # shell con php, composer e artisan\ndocker compose exec db mysql -udeliveboo -plocal_password deliveboo"}, {"code": "docker compose stop    # ferma, non cancella niente\ndocker compose down    # rimuove i container, il DB resta nel volume\ndocker compose down -v # ATTENZIONE: cancella anche il database\ndocker compose build   # dopo una modifica a docker/dev/Dockerfile"}, {"p": "Aggiornare il DB di sviluppo dopo la migrazione a Laravel 13 (nuova immagine PHP 8.4 + migration dei prezzi, dati intatti):", "code": "docker compose build && docker compose up -d && docker compose exec app php artisan migrate"}]}, {"title": "Front-end: varianti", "items": [{"code": "npm run build        # compila una volta resources/ -> public/build (quella del Dockerfile)\nnpm run dev          # server Vite con HMR (in Codespace serve la porta 5173 inoltrata)\nnpm run test:js      # test Vitest: store, pagamento con mock, ogni pagina della SPA"}]}, {"title": "Log, build e deploy", "items": [{"code": "tail -f storage/logs/laravel.log   # errori 500 ed email (MAIL_MAILER=log)\ndocker build -t deliveboo .        # immagine di produzione (Node 22 per la build + Apache/PHP 8.4)\ndocker run --rm -p 8080:80 deliveboo\ngit push origin master             # Render ricostruisce e pubblica"}, {"p": "`./build.sh` mette in cache config, rotte e viste: da Laravel 8 anche la rotta catch-all (una Closure) si può mettere in cache."}, {"p": "La mappa (`dev/`) non va mai collegata dal sito né copiata nella build: `.dockerignore` la esclude."}]}];

const CMDS = [{"g": "Migrations · struttura delle tabelle", "items": [{"c": "php artisan migrate", "d": "Esegue solo le migration non ancora eseguite. Non tocca i dati esistenti.", "art": 1}, {"c": "php artisan migrate:status", "d": "Mostra quali migration sono state eseguite (Ran) e quali mancano.", "art": 1}, {"c": "docker compose build && docker compose up -d && docker compose exec app php artisan migrate", "d": "Aggiorna il DB di sviluppo dopo la migrazione a Laravel 13: ricostruisce l'immagine PHP 8.4, riavvia i container e aggiunge solo la migration dei prezzi. Nessun dato perso."}, {"c": "php artisan make:migration add_quantity_to_order_plate_table --table=order_plate", "d": "Crea una nuova migration per modificare una tabella. Regola del progetto: non modificare mai le migration storiche, aggiungine una nuova. Esempio: `Poi aggiorna #[Fillable([...])] nel modello in app/.`", "art": 1}, {"c": "php artisan make:migration create_reviews_table --create=reviews", "d": "Nuova migration che crea una tabella.", "art": 1}, {"c": "php artisan migrate:rollback --step=1", "d": "Annulla l'ultima migration eseguendo il suo down(): può eliminare colonne o tabelle con i loro dati.", "x": 1, "art": 1}, {"c": "php artisan migrate:fresh --seed", "d": "Elimina TUTTE le tabelle, le ricrea e rilancia i seeder. Tutti i dati vanno persi. Esempio: `Va bene per ripartire da un DB pulito e coerente, mai su dati veri.`", "x": 1, "art": 1}, {"c": "php artisan migrate:refresh --seed", "d": "Esegue il rollback di tutte le migration e poi le ripete. Tutti i dati vanno persi.", "x": 1, "art": 1}]}, {"g": "Seed · dati di prova, idempotenti: si possono rilanciare", "items": [{"c": "SEED_PROFILE=test php artisan db:seed", "d": "Semina il catalogo ridotto dei test (2 ristoratori, menu corti) invece di quello completo.", "art": 1}, {"c": "php artisan db:seed --class=MenusSeeder", "d": "Solo i menu del catalogo generato: crea i piatti dei ristoranti che non ne hanno ancora.", "art": 1}, {"c": "php artisan db:seed", "d": "Esegue DatabaseSeeder: Users → Types → Restaurants → Plates → Orders → Rates. Crea solo quello che manca, senza duplicare né sovrascrivere. Esempio: `Hai cancellato un piatto di prova? Rilancia e torna.`", "art": 1}, {"c": "php artisan db:seed --class=OrdersTableSeeder", "d": "Un solo seeder. Richiede che quelli precedenti nella catena siano già stati eseguiti; se no si ferma con un errore chiaro e non scrive nulla.", "art": 1}, {"c": "php artisan migrate --seed", "d": "Migration nuove e poi tutti i seeder, in un colpo solo.", "art": 1}, {"c": "php artisan make:seeder ReviewsTableSeeder", "d": "Crea un nuovo seeder in database/seeders/ (namespace Database\\Seeders). Aggiungilo a DatabaseSeeder rispettando l'ordine delle dipendenze. Cerca i record per chiave naturale (email, nome), mai per ID.", "art": 1}, {"c": "composer dump-autoload", "d": "Rigenera l'autoload di Composer. I seeder ora sono caricati via PSR-4 (Database\\Seeders), quindi di solito non serve; utile se compare \"Target class [...] does not exist\".", "art": 1}, {"c": "php artisan db:seed --force", "d": "Con APP_ENV=production Laravel chiede conferma: --force la salta.", "art": 1}, {"c": "php artisan db:seed --class=DemoAccountsSeeder", "d": "Crea gli account demo di config/demo.php che mancano (admin di piattaforma e cliente Mario Rossi); non sovrascrive mai un account esistente.", "art": 1}]}, {"g": "Generatori · file nuovi già pronti", "items": [{"c": "php artisan make:model Review -m", "d": "Modello in app/Review.php (namespace App, non App\\Models) più la sua migration.", "art": 1}, {"c": "php artisan make:controller Api/ReviewController", "d": "Controller per un endpoint JSON. Poi aggiungi la rotta in routes/api.php e rispondi con response()->json().", "art": 1}, {"c": "php artisan make:controller Admin/ReviewController --resource", "d": "Controller CRUD per il pannello. La rotta va nel gruppo admin di routes/web.php (middleware auth), prima della catch-all. Controlla sempre restaurant.user_id == auth()->id().", "art": 1}, {"c": "php artisan make:request StorePlateRequest", "d": "Classe di validazione per un form.", "art": 1}, {"c": "php artisan make:mail OrderShipped --markdown=mails.orderShipped", "d": "Nuova email come OrderedMessage. Attenzione a maiuscole e minuscole nel nome della vista su Linux/Docker.", "art": 1}, {"c": "php artisan make:test ReviewTest", "d": "Test in tests/Feature (con --unit in tests/Unit).", "art": 1}]}, {"g": "Rotte, debug e test", "items": [{"c": "php artisan route:list", "d": "Tutte le rotte con metodo, URL, nome e controller.", "art": 1}, {"c": "php artisan route:list --path=api", "d": "Solo le rotte che contengono \"api\" (gli endpoint usati da Vue).", "art": 1}, {"c": "php artisan tinker", "d": "Console PHP con il progetto caricato: interroghi i modelli dal vivo. Esempio: `App\\Restaurant::where('slug','mc-donalds')->first()->plates->count()`", "art": 1}, {"c": "php artisan tinker --execute=\"dump(App\\Order::count())\"", "d": "Esegue una sola riga di tinker e termina.", "art": 1}, {"c": "php artisan test", "d": "Tutti i test (SQLite in memoria, come da phpunit.xml).", "art": 1}, {"c": "php artisan test --filter=DatabaseSeederTest", "d": "Solo i test che corrispondono al nome.", "art": 1}]}, {"g": "Cache e configurazione", "items": [{"c": "php artisan optimize:clear", "d": "Svuota insieme la cache di config, rotte, viste e dati. È il primo rimedio quando una modifica a .env o alle rotte \"non si vede\".", "art": 1}, {"c": "php artisan config:clear", "d": "Solo la cache della configurazione (.env e config/).", "art": 1}, {"c": "php artisan view:clear", "d": "Solo le viste Blade compilate.", "art": 1}, {"c": "php artisan config:cache", "d": "Mette in cache la configurazione: solo in produzione. Dopo, le modifiche a .env vengono ignorate fino a config:clear.", "art": 1}, {"c": "php artisan route:cache", "d": "Mette in cache le rotte: solo in produzione (lo fa build.sh). Da Laravel 8 funziona anche con la catch-all {any?}, che è una Closure. Dopo ogni modifica alle rotte serve route:clear.", "art": 1}]}, {"g": "Altro", "items": [{"c": "php artisan key:generate", "d": "Nuova APP_KEY. Su un sito già usato invalida sessioni e dati cifrati.", "art": 1}, {"c": "php artisan storage:link", "d": "Link public/storage → storage/app/public per le immagini caricate.", "art": 1}, {"c": "php artisan down", "d": "Mette il sito in manutenzione (pagina 503); php artisan up lo riapre.", "art": 1}, {"c": "php artisan list", "d": "Tutti i comandi artisan disponibili; php artisan help migrate mostra le opzioni di un comando.", "art": 1}, {"c": "php artisan foodsy:make-admin persona@example.com", "d": "Promuove un account ad admin di piattaforma (o ne crea uno nuovo) dopo conferma. Con il seeder degli account demo è l'unico modo di avere un admin: i form pubblici e il backoffice non lo offrono mai.", "art": 1}]}];

const PAY_SECTIONS = [{"h": "Come funziona un pagamento, in parole semplici", "steps": ["Scrivi i dati della carta. Il nostro sito non li guarda nemmeno: li legge un <b>cassiere</b> esterno (Braintree, un'azienda di PayPal) dentro dei riquadri tutti suoi.", "Il cassiere ti dà in cambio un <b>biglietto usa e getta</b> (si chiama <i>nonce</i>). Il biglietto dice “questa carta va bene”, ma il numero della carta non c'è scritto sopra.", "Il sito manda al nostro server il biglietto e la lista dei piatti. <b>Il prezzo no</b>: quello lo calcola il server guardando il menu, così nessuno può fare il furbo e pagare 1 centesimo.", "Il server scrive l'ordine sul suo quaderno come <b>“in attesa”</b>, poi chiede al cassiere: “incassa 13 € con questo biglietto”.", "Se il cassiere dice <b>sì</b>, l'ordine diventa “pagato”, il cliente riceve la mail e il ristoratore lo vede. Se dice <b>no</b>, l'ordine diventa “rifiutato”: niente mail, e il ristoratore non lo vede."]}, {"h": "Il pagamento simulato (fake)", "text": ["È come giocare al supermercato con i soldi finti: le regole sono quelle vere, ma nessuno incassa niente.", "Il cassiere finto vive dentro il nostro sito. Controlla che la carta sembri giusta (numero, scadenza, CVV) e ti dà lo stesso tipo di biglietto che darebbe Braintree. Con la carta di prova “buona” dice sì, con quella di rifiuto dice no: sono nella tab “Carte di prova”."], "go": ["app/Payments/FakeGateway.php", "resources/js/api/fakeHostedFields.js"]}, {"h": "Perché il finto funziona come il vero", "text": ["Il server non sa chi sia il cassiere: parla con tutti e due allo stesso modo, come un caricatore USB che va bene per qualsiasi telefono.", "Tutto il resto è identico: il prezzo calcolato dal server, l'ordine in attesa, poi pagato o rifiutato, e la mail. Per passare ai pagamenti veri si cambiano solo alcune righe del file <code>.env</code>, il codice resta uguale."], "go": ["app/Payments/PaymentGateway.php", "app/Payments/BraintreeGateway.php", "app/Http/Controllers/Api/OrderController.php"]}, {"h": "A cosa serve PAYMENT_DRIVER=fake nel .env", "env": "PAYMENT_DRIVER=fake", "text": ["È l'<b>interruttore</b> che sceglie il cassiere. <code>fake</code> vuol dire cassiere finto: è gratis, non serve nessun account e funziona sempre. <code>braintree</code> vuol dire cassiere vero, e servono le 3 chiavi di Braintree nel <code>.env</code>."], "go": ["config/services.php", "app/Providers/AppServiceProvider.php"]}, {"h": "E se quella riga non ci fosse?", "text": ["Non succede niente di male: se la riga manca, il sito usa da solo il cassiere finto. Questa scelta “di riserva” è scritta in <code>config/services.php</code>. Scrivere la riga serve solo a far capire subito a chi legge quale cassiere si sta usando.", "Attenzione invece agli errori di battitura: se scrivi un nome che non esiste (per esempio <code>braintre</code>), la pagina di pagamento dà errore. È fatto apposta, così te ne accorgi subito invece di pagare con il cassiere sbagliato. E se scrivi <code>braintree</code> senza le chiavi, la pagina dice che il servizio di pagamento non è disponibile."], "warn": true}];

const TEST_PAGE = {"title": "Carte di prova", "lead": "Come simulare un pagamento <b>riuscito</b> e uno <b>rifiutato</b> senza muovere soldi veri. Nel checkout, sopra il campo “First name”, una barra gialla “Test mode” apre una finestra con le stesse carte, ma solo in un ambiente di prova (driver <code>fake</code> o Braintree <code>sandbox</code>): in produzione la barra non esiste. Tab aggiunta rispetto alle 3 standard della skill.", "check": {"h": "Prima di tutto: quale cassiere stai usando?", "c": "grep -E '^(PAYMENT_DRIVER|BRAINTREE_ENVIRONMENT)' .env", "d": "La finestra “Test mode” del checkout lo dice già: “Demo payments” = driver fake, “Braintree sandbox” = driver braintree. Dopo una modifica al `.env`: `php artisan config:clear`."}, "drivers": [{"tag": "PAYMENT_DRIVER=fake", "title": "Cassiere finto (offline)", "color": "accent", "sub": "Nessun account, nessuna rete: i campi carta sono caselle del sito e il rifiuto dipende dal <b>numero della carta</b>.", "cards": [{"ok": true, "label": "Pagamento riuscito", "value": "4111 1111 1111 1111"}, {"ok": false, "label": "Pagamento rifiutato", "value": "4000 0000 0000 0002"}], "rules": ["Scadenza: qualsiasi data futura, es. `12/30`. CVV: 3 o 4 cifre qualsiasi.", "Un numero che non supera il controllo di Luhn (es. `1234 1234 1234 1234`) non è un rifiuto: dà l'errore “Enter a valid card number.” sotto il campo.", "Ogni altra carta valida (es. `5555 5555 5555 4444`) viene accettata."]}, {"tag": "PAYMENT_DRIVER=braintree · sandbox", "title": "Braintree sandbox (il tuo .env attuale)", "color": "blue", "sub": "Campi carta veri di Braintree. Attenzione: in sandbox il rifiuto <b>non dipende dalla carta ma dall'importo</b>. Un totale tra €2,000.00 e €2,999.99 viene rifiutato con un codice uguale all'importo (documentazione Braintree, “Testing”). La carta 4000 0000 0000 0002 qui <b>non</b> è una carta di rifiuto.", "cards": [{"ok": true, "label": "Pagamento riuscito", "value": "4111 1111 1111 1111"}, {"ok": true, "label": "Altra carta valida", "value": "5555 5555 5555 4444"}], "steps": ["Apri il ristorante <b>Peri's</b> (<code>/chosen-restaurant-menu-and-details/peris</code>) e vai alla pagina 3 del menu.", "Aggiungi <b>12 × Dom Pérignon</b> (€170): il totale diventa <b>€2,040.00</b>.", "Paga con <code>4111 1111 1111 1111</code>, scadenza futura, CVV qualsiasi: Braintree rifiuta (codice 2040) e il checkout mostra il messaggio in rosso.", "Per tornare a un pagamento riuscito basta un totale sotto €2,000: togli qualche bottiglia."], "rules": ["Scadenza: qualsiasi data futura. CVV: qualsiasi, tranne `200`, `201` e `301`, che simulano CVV non verificati se nella sandbox sono attive le regole CVV.", "Un importo tra €3,000.00 e €3,000.99 dà invece “Failed” (codice 3000), un guasto del processore.", "Le transazioni si vedono nel pannello sandbox.braintreegateway.com → Transactions."]}], "outcomesTitle": "Cosa succede dopo", "outcomes": [{"ok": true, "h": "Pagamento riuscito", "t": "L'ordine diventa `paid` con il `transaction_id`, il carrello si svuota, si apre la pagina di successo con la ricevuta (ordine, “Braintree sandbox” o “Demo payment”, Transaction ID), parte l'email di conferma (con `MAIL_MAILER=log` la trovi in `storage/logs/laravel.log`) e il ristoratore vede l'ordine nell'area partner."}, {"ok": false, "h": "Pagamento rifiutato", "t": "L'ordine resta nel database come `failed` con `payment_error`, il carrello resta pieno, il messaggio rosso compare sopra il bottone Pay: si può correggere e riprovare. Nessuna email, e il ristoratore non lo vede."}], "go": ["resources/js/pages/Payment", "app/Payments/FakeGateway.php", "app/Payments/BraintreeGateway.php", "resources/js/api/fakeHostedFields.js"]};

const STYLE_PAGE = {"title": "Stile e brand · «Mercato»", "lead": "La direzione grafica di Foodsy spiegata per chi aggiunge pagine o componenti: cosa vogliamo comunicare, la palette e il ruolo di ogni colore, i font, il logo, le foto e le regole per restare coerenti. Tutti i valori vivono in <code>resources/css/tokens.css</code>: qui c'è il <b>perché</b>. Tab aggiunta rispetto alle 3 standard della skill.", "concept": {"h": "L'idea: un mercato gastronomico contemporaneo", "p": ["Foodsy deve far venire fame e dare fiducia. Pensa a un mercato coperto di oggi: banchi pieni di cibo vero, carta da forno, scontrini, insegne scritte grandi. <b>Il cibo è il protagonista</b>, l'interfaccia è il banco su cui è appoggiato: pulita, calda, ordinata.", "Volevamo comunicare <b>qualità gastronomica</b> (foto grandi e curate), <b>immediatezza</b> (un'azione principale per schermata, prezzi sempre visibili), <b>affidabilità</b> (contrasti AA, pagamento spiegato), <b>personalità</b> (un carattere tipografico con spigoli e calore, non il solito font da software).", "Cosa evitiamo di proposito: l'aspetto da fintech, banca o gestionale. Niente blu corporate, niente grigi freddi, niente tabelle dove servono foto, niente dashboard sul sito clienti."]}, "words": ["Appetitoso", "Caldo", "Affidabile", "Immediato", "Contemporaneo", "Con carattere"], "palette": [{"g": "Brand", "d": "Il colore ufficiale e le sue varianti funzionali.", "c": [{"t": "--brand", "hex": "#d0682c", "r": "Colore ufficiale. Solo logo, favicon e grandi superfici con testo scuro (banda “Cook for Foodsy”, numero di classifica). Mai testo bianco sopra: 3.6:1, non passa AA."}, {"t": "--brand-strong", "hex": "#a8501c", "r": "Paprika: l'arancio delle azioni. Bottoni primari, tasto + dei piatti, prezzi, link, eyebrow. Testo bianco sopra = 5.5:1 (AA)."}, {"t": "--brand-deep", "hex": "#85400f", "r": "Hover e pressione dei bottoni primari."}, {"t": "--brand-soft", "hex": "#f8dcc8", "r": "Selezione del testo, eyebrow su fondo scuro."}, {"t": "--brand-wash", "hex": "#fcefe4", "r": "Fondi tenui legati al brand (hover dei bottoni chiari, intestazioni delle tabelle)."}]}, {"g": "Superfici", "d": "Neutri caldi: il banco su cui appoggiare il cibo.", "c": [{"t": "--paper", "hex": "#faf8f4", "r": "Porcellana: il fondo di ogni pagina."}, {"t": "--surface", "hex": "#ffffff", "r": "Card, pannelli, campi, carrello."}, {"t": "--oat", "hex": "#f1ece3", "r": "Avena: pozzetti, segnaposto delle foto, stati vuoti, righe delle carte di prova."}, {"t": "--oat-deep", "hex": "#e6ded1", "r": "Avena scura per separazioni su fondo avena."}, {"t": "--line", "hex": "#e8e1d6", "r": "Bordi sottili e divisori."}, {"t": "--line-strong", "hex": "#d5cbbb", "r": "Bordi di campi, chip e bottoni outline."}, {"t": "--flag-edge", "hex": "#e0ddda", "r": "Filo traslucido (inchiostro al 16%) intorno alle bandiere delle lingue: le strisce bianche restano visibili su porcellana e bianco."}]}, {"g": "Profondità", "d": "Il verde rosmarino è il “nero” di Foodsy: dà peso senza essere freddo.", "c": [{"t": "--forest", "hex": "#1f2b23", "r": "Footer, banda “Guest favourites”, bottone del carrello, chip attive, stepper, pagina corrente."}, {"t": "--forest-soft", "hex": "#2e3d32", "r": "Hover sugli elementi rosmarino."}, {"t": "--forest-line", "hex": "#3c4c40", "r": "Bordi e divisori su fondo rosmarino."}]}, {"g": "Inchiostri", "d": "Testi caldi, mai grigio puro.", "c": [{"t": "--ink", "hex": "#1c1a17", "r": "Titoli e testo principale."}, {"t": "--ink-soft", "hex": "#4a453e", "r": "Testo secondario, descrizioni dei piatti."}, {"t": "--ink-muted", "hex": "#6e675e", "r": "Note, metadati, ingredienti (AA su porcellana)."}, {"t": "--ink-inverse", "hex": "#faf8f4", "r": "Testo su rosmarino e sulle foto."}, {"t": "--ink-inverse-soft", "hex": "#c9d1c8", "r": "Testo secondario su rosmarino."}]}, {"g": "Dispensa · stati", "d": "Colori presi dalla cucina, ognuno con un significato fisso.", "c": [{"t": "--olive", "hex": "#56682b", "r": "Positivo: pagamento riuscito, conferme, vantaggi dell'hero."}, {"t": "--olive-soft", "hex": "#e7ecd6", "r": "Fondo dei messaggi positivi."}, {"t": "--saffron", "hex": "#e5a13a", "r": "Attenzione e valutazioni: stelle, barra e badge “Test mode”."}, {"t": "--saffron-soft", "hex": "#fbebd0", "r": "Fondo dei messaggi informativi."}, {"t": "--saffron-ink", "hex": "#7a5000", "r": "Testo sui fondi zafferano (AA)."}, {"t": "--tomato", "hex": "#c4372c", "r": "Negativo: errori, pagamento rifiutato, piatto non disponibile, elimina."}, {"t": "--tomato-soft", "hex": "#fae1dd", "r": "Fondo dei messaggi di errore."}]}], "rulesTitle": "Come usare i colori", "do": ["Un solo arancio d'azione (<code>--brand-strong</code>) e <b>un solo bottone primario per schermata</b>: il resto è outline o ghost.", "Le foto portano il colore: intorno usa superfici neutre (porcellana, bianco, avena).", "Alterna le fasce per dare ritmo: porcellana → rosmarino → porcellana → arancio brand. Mai due fasce scure di fila.", "Oliva, zafferano e pomodoro solo per il loro significato (ok, attenzione, errore).", "Testo sopra una foto solo con la sfumatura <code>--photo-fade</code>."], "dont": ["Testo bianco su <code>--brand</code> #d0682c.", "Colori scritti a mano nei CSS: ogni valore viene da <code>tokens.css</code>.", "Il logo ricolorato, trasparente o con filtri.", "Blu, viola o grigi freddi: rompono il tono gastronomico.", "Riprendere i colori del vecchio stile (crema, espresso, basilico): sono stati rimossi da tokens.css."], "type": {"h": "Tipografia", "fonts": [{"name": "Bricolage Grotesque", "css": "\"Bricolage Grotesque\", system-ui, sans-serif", "weight": 800, "sample": "Dinner from the city's best kitchens.", "use": "Display: titoli (800, spaziatura stretta −0.035em), nomi dei piatti e dei ristoranti (700), prezzi (cifre tabulari), logo. È un grottesco con spigoli e un po' di irregolarità: personalità da insegna di mercato, ma leggibile.", "token": "--font-display"}, {"name": "Figtree", "css": "\"Figtree\", system-ui, sans-serif", "weight": 500, "sample": "Pizza from the wood oven, sushi rolled to order, slow-cooked ragù.", "use": "Testo e interfaccia: descrizioni, campi, bottoni (800), etichette in maiuscolo spaziato. Geometrico ma morbido, molto leggibile anche piccolo.", "token": "--font-sans"}], "scale": "Scala: `--text-xs` 12 · `--text-sm` 14 · `--text-base` 16 · `--text-md` 18 · `--text-lg` 22 · `--text-xl` 24–30 · `--text-2xl` 32–48 · `--text-3xl` 44–84 px (fluide con clamp). Classi pronte: `ui-display`, `ui-title`, `ui-subtitle`, `ui-lead`, `ui-eyebrow`, `ui-price`.", "perf": "Entrambi i font sono variabili, locali (`resources/fonts`, licenza OFL), solo alfabeto latino: 61 kB in tutto, `font-display: swap`, nessuna richiesta a Google."}, "blocks": [{"h": "Logo", "p": ["Un solo file: <code>public/images/foodsy-mark.svg</code>, la cloche con la geometria originale, sempre in <b>#D0682C</b>. Lo usano <code>Logo</code> (Vue), <code>&lt;x-logo&gt;</code> (Blade) e la favicon; PNG e ICO sono generati da lì.", "Il nome “Foodsy” accanto è in Bricolage 800, colore inchiostro (o porcellana su fondo scuro). Il marchio non va mai su fondo arancio (sparirebbe) né con trasparenze."], "go": ["public/images/foodsy-mark.svg", "resources/js/components/Logo"]}, {"h": "Il motivo grafico: il vassoio", "p": ["La barra arrotondata sotto la cloche del logo diventa la firma del sistema: una barretta arancio 28×4 px davanti a ogni titoletto di sezione (<code>.ui-eyebrow::before</code>, token <code>--tray-width</code> e <code>--tray-height</code>). Usala solo lì: se compare ovunque perde forza."]}, {"h": "Fotografie", "p": ["Le foto sono <b>sempre link esterni</b> (Unsplash, con <code>?auto=format&amp;fit=crop&amp;w=…</code>): Foodsy non ospita foto. Proporzioni fisse per tipo: piatti 4:3, card ristorante 3:2, cucine 4:5, copertina del ristorante a tutta larghezza, raggio <code>--radius-lg</code>.", "Nessun filtro CSS (costano e falsano il cibo). Se la foto manca o non si carica, <code>FoodImage</code> / <code>&lt;x-photo&gt;</code> mostrano il logo su fondo avena."], "go": ["resources/js/components/FoodImage", "database/seeders/PlatesTableSeeder.php"]}, {"h": "Componenti e composizione", "p": ["Bottoni a pillola (48 px, 56 px i grandi), card senza bordo con la foto in testa, chip per i filtri, stepper rosmarino per le quantità. Raggi: 3 px (solo bandiere, <code>--radius-xs</code>), 8 / 12 / 18 / 28 px e pillola.", "Ogni pagina ha un obiettivo e una composizione propria: la home esplora (hero, cucine, preferiti, tutti i ristoranti), la pagina ristorante vende (copertina, menu, carrello sempre a portata), il checkout rassicura (step numerati, riepilogo, barra Test mode discreta). Non trasformare tutto in una griglia di card uguali."]}, {"h": "Lingue e bandiere", "p": ["Il sito e l'area partner parlano inglese (default), italiano, tedesco, francese e spagnolo. Il menu lingua sta nell'header, accanto alla ricerca: bandiera 20×13 + sigla in maiuscolo spaziato (EN, IT, DE, FR, ES) e una chevron che ruota; sotto i 600 px solo bandiera + sigla. Il pannello riprende il menu account: card bianca, titoletto con il vassoio, righe con bandiera, nome nativo (Deutsch, Français…) e sigla; la lingua attiva è su <code>--brand-wash</code> con la spunta paprika.", "Le bandiere sono SVG minimi (<code>resources/icons/flags.json</code>, poche centinaia di byte), raggio <code>--radius-xs</code> e filo <code>--flag-edge</code>; sono decorative, il nome della lingua è sempre scritto. Stili condivisi <code>ui-lang-*</code> / <code>ui-flag</code> in <code>ui.css</code> per Vue e Blade.", "Testi lunghi in tedesco o francese: i titoli vanno a capo, mai troncati; prezzi sempre nel formato <code>€12.00</code> in ogni lingua."], "go": ["resources/js/components/LocaleSwitch", "resources/icons/flags.json", "resources/js/utils/strings.json"]}, {"h": "Avatar degli utenti", "p": ["Chi non entra con Google ha un avatar cartoon a mezzo busto disegnato da noi (pacchetto <code>packages/svg-avatar</code>): tratti morbidi, colori caldi, sfondo pastello ritagliato a cerchio. Si ispira al linguaggio generale degli avatar illustrati (stile Avataaars) ma ogni forma è originale.", "Lo stesso seed dà sempre lo stesso avatar. «Personalizza avatar» nel menu account apre l'editor del pacchetto (viso, pelle, capelli, occhi, sopracciglia, naso, bocca, vestito, accessorio, sfondo, con suggerimenti per look e «Sorprendimi»), temato con i token del sito tramite le variabili <code>--sa-*</code> in <code>.adm-avatar-editor</code>. I colori degli avatar arrivano dalla palette del pacchetto (<code>palettes/default.json</code>), separata dai token: per armonizzarli si cambia la palette, mai i disegni.", "Misure: leggibile da 24 px in su (header partner 34 px). È decorativo quando il nome è scritto accanto; da solo va usato con <code>label</code>. Anteprima di tutte le varianti: <code>dev/avatar-grid.html</code>."], "go": ["packages/svg-avatar", "dev/avatar-grid.html", "resources/views/admin/avatar/edit.blade.php"]}, {"h": "Regole CSS", "p": ["Una classe per selettore, modificatori come classi aggiuntive (<code>ui-btn ui-btn--primary</code>), niente nesting né selettori discendenti, niente <code>!important</code> (le due eccezioni sono in <code>base.css</code>).", "Animazioni solo su <code>transform</code> e <code>opacity</code>. Breakpoint mobile-first 600 / 900 / 1200 px. Primitive condivise in <code>ui.css</code>, stile specifico nel <code>Nome.css</code> del componente."], "go": ["resources/css/tokens.css", "resources/css/ui.css"]}], "checkTitle": "Checklist per una nuova schermata", "check": ["Qual è l'obiettivo della pagina? Una sola azione primaria, in paprika.", "Le foto sono grandi abbastanza e con le proporzioni del loro tipo?", "Ogni colore viene da un token e rispetta il suo ruolo?", "Titoli in Bricolage, testo in Figtree, prezzi con <code>ui-price</code> e <code>formatPrice</code>?", "Funziona a 390, 768 e 1280 px senza scroll orizzontale, anche in tedesco (le parole più lunghe)?", "Nessun testo scritto nel template: ogni stringa è una chiave di <code>strings.json</code> nelle 5 lingue?", "Focus visibile e navigazione da tastiera? Contrasti AA?"]};

function copyText(txt,btn,label){

}

   <h2>${esc(C.type.h)}</h2><div class="tc-grid">${C.type.fonts.map(f=>`<section class="pay-s st-font"><p class="st-sample" style="font-family:${esc(f.css)};font-weight:${f.weight}">${esc(f.sample)}</p><h3>${esc(f.name)} <code>${esc(f.token)}</code></h3><p>${esc(f.use)}</p></section>`).join("")}</div>
   <p class="lead st-gd">${rich(C.type.scale)}</p><p class="lead st-gd">${rich(C.type.perf)}</p>
   ${C.blocks.map(b=>`<section class="pay-s"><h2>${esc(b.h)}</h2>${b.p.map(t=>`<p>${t}</p>`).join("")}${files(b.go)}</section>`).join("")}
   <section class="pay-s is-warn"><h2>${esc(C.checkTitle)}</h2><ol class="pay-steps">${C.check.map(t=>`<li>${t}</li>`).join("")}</ol></section>
  </div>`;
  P.addEventListener("click",e=>{const b=e.target.closest("[data-cp]"); if(b)copyText(b.dataset.cp,b,"Copia");});
})();

/* ---------- hash: tab e file aperto ---------- */
function readHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="code"||h.startsWith("code/")){ openFile(h.slice(5)); show("code"); return; }
  if(TABS.some(t=>t.id===h)){ show(h); return; }
  openFile(""); show("graph");
}
window.addEventListener("hashchange",readHash);
readHash();
})();
</script>
</body>
