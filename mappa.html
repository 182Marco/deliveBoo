:root{
  --bg:#f6f7f9; --panel:#ffffff; --side:#f0f1f4; --line:#d9dce3; --txt:#1f2430; --mut:#667085;
  --acc:#00a896; --accbg:#d9f3ef; --sel:#dbeafe; --code:#eef0f4;

  :root:not([data-theme="light"]){
    --bg:#1e1e1e; --panel:#252526; --side:#252526; --line:#3c3c3c; --txt:#d4d4d4; --mut:#9aa0a6;
    --acc:#2dd4bf; --accbg:#0f3b38; --sel:#094771; --code:#2d2d2d;
    --c-user:#9ca3af; --c-front:#4ade80; --c-api:#60a5fa; --c-admin:#fb923c; --c-model:#c084fc; --c-ext:#94a3b8; --c-build:#2dd4bf;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1e1e; --panel:#252526; --side:#252526; --line:#3c3c3c; --txt:#d4d4d4; --mut:#9aa0a6;
  --acc:#2dd4bf; --accbg:#0f3b38; --sel:#094771; --code:#2d2d2d;
  --c-user:#9ca3af; --c-front:#4ade80; --c-api:#60a5fa; --c-admin:#fb923c; --c-model:#c084fc; --c-ext:#94a3b8; --c-build:#2dd4bf;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:0 16px;height:48px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:16px;margin:0;white-space:nowrap}
header h1 span{color:var(--acc)}
.tabs{display:flex;gap:4px;height:100%}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;font-weight:600;padding:0 14px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--txt);border-color:var(--acc)}
.tab:focus-visible,.btn:focus-visible,.row:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.spacer{flex:1}
.btn{background:var(--code);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
main{flex:1;min-height:0;display:flex}
section.view{display:none;flex:1;min-width:0;min-height:0}
section.view.on{display:flex}

/* ---------- FILE VIEW ---------- */
#v-files{flex-direction:row}
aside{width:310px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:8px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:inherit;font-size:13px}
.explorer{flex:1;overflow:auto;padding:4px 0 24px;font-size:13px;user-select:none}
.explorer .cap{padding:6px 12px;font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:700}
.row{display:flex;align-items:center;gap:5px;height:24px;cursor:pointer;white-space:nowrap;padding-right:8px}
.row:hover{background:color-mix(in srgb,var(--txt) 8%,transparent)}
.row.sel{background:var(--sel)}
.chev{width:14px;flex:none;text-align:center;color:var(--mut);transition:transform .12s;font-size:12px}
.open>.row>.chev{transform:rotate(90deg)}
.kids{display:none}
.open>.kids{display:block}
.ic{width:16px;height:16px;flex:none;border-radius:3px;font-size:8px;font-weight:800;display:grid;place-items:center;color:#fff;letter-spacing:-.3px}
.nm{overflow:hidden;text-overflow:ellipsis}
.hl{background:#facc1560;border-radius:2px}
#doc{flex:1;min-width:0;overflow:auto;padding:28px clamp(16px,4vw,48px) 60px}
.card{max-width:860px;margin:0 auto}

/* ---------- explanation panel ---------- */
.crumbs{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:2px}
.crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.title{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.title h2{margin:0;font-size:26px;word-break:break-word}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.lead{font-size:19px;margin:14px 0 20px;line-height:1.5}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.box h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.box p{margin:0}
.ex{border-left:4px solid var(--acc)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.step{background:var(--accbg);color:var(--txt);border:1px solid var(--acc);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.step small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.arrow{color:var(--acc);font-weight:800}
pre{background:var(--code);border-radius:8px;padding:10px 12px;margin:8px 0 0;overflow:auto;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--txt);font-family:inherit}
.chip:hover{border-color:var(--acc)}
.kidlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.kid{display:block;text-align:left;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--txt)}
.kid:hover{border-color:var(--acc)}
.kid b{display:block;font-size:13px;word-break:break-all}
.kid span{font-size:12px;color:var(--mut)}

/* ---------- GRAPH VIEW ---------- */
#v-graph{flex-direction:column;overflow:auto}
.gwrap{display:flex;flex:1;min-height:0}
.gcanvas{flex:1;min-width:0;overflow:auto;padding:10px}
.gcanvas svg{width:100%;min-width:900px;height:auto;display:block}
#gpanel{width:340px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px}
#gpanel .title h2{font-size:20px}
#gpanel .lead{font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut);background:var(--panel)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lane{fill:color-mix(in srgb,var(--txt) 4%,transparent);stroke:var(--line);stroke-dasharray:4 4}
.lanet{fill:var(--mut);font-size:12px;font-weight:700;letter-spacing:.1em}
.node{cursor:pointer;transition:opacity .15s}
.node rect{fill:var(--panel);stroke-width:2}
.node text{fill:var(--txt);font-size:12.5px;font-weight:700}
.node text.s{font-size:10.5px;font-weight:400;fill:var(--mut)}
.node:hover rect,.node.pick rect{stroke-width:3.5}
.node:focus-visible rect{stroke-width:3.5}
.edge{fill:none;stroke:var(--mut);stroke-width:1.5;opacity:.7;transition:opacity .15s}
.elab{font-size:10.5px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.dim{opacity:.12}
.hot{stroke:var(--acc);stroke-width:2.8;opacity:1}
.help{font-size:13px;color:var(--mut);padding:8px 14px}

#v-run{overflow:auto}
#run{max-width:860px;margin:0 auto;padding:28px 16px 60px;width:100%}
#run h2{margin:0 0 4px;font-size:26px}
.stp{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.stp.done{opacity:.55}
.stp input{width:20px;height:20px;margin-top:3px;accent-color:var(--acc);flex:none}
.stp h3{margin:0 0 2px;font-size:16px}
.stp p{margin:2px 0 6px;color:var(--mut);font-size:14px}
.cmd{display:flex;align-items:flex-start;gap:8px;margin-top:6px}
.cmd pre{flex:1;margin:0;white-space:pre-wrap;word-break:break-all}
.warn{background:color-mix(in srgb,#f59e0b 14%,var(--panel));border:1px solid #f59e0b;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.miss{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.miss span{padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
.no{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
@media (max-width:820px){
  #v-files{flex-direction:column}
  aside{width:100%;max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
  .gwrap{flex-direction:column}
  #gpanel{width:100%;border-left:0;border-top:1px solid var(--line)}
  header h1 span{display:none}
}
</style>

const treeEl=document.getElementById("tree"), docEl=document.getElementById("doc");

function buildTree(n,depth,parentEl){
  const li=document.createElement("div"); li.className="item"; li.dataset.p=n.path;
  const row=document.createElement("div"); row.className="row"; row.tabIndex=0; row.setAttribute("role","treeitem");
  row.style.paddingLeft=(8+depth*14)+"px";
  row.innerHTML=`<span class="chev">${n.dir?"›":""}</span>${icon(n)}<span class="nm">${esc(n.name)}</span>`;
  li.appendChild(row); parentEl.appendChild(li); nodeEls[n.path]={li,row,n};
  if(n.dir){
    const k=document.createElement("div"); k.className="kids"; li.appendChild(k);
    n.kids.forEach(c=>buildTree(c,depth+1,k));
  }
  row.addEventListener("click",()=>{ if(n.dir) li.classList.toggle("open"); select(n.path,true); });
  row.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();row.click();}
    if(e.key==="ArrowRight"&&n.dir)li.classList.add("open"); if(e.key==="ArrowLeft"&&n.dir)li.classList.remove("open");});
}

}
let selected=null;
function select(p,fromTree){
  if(!byPath[p]) p="";

  selected=p;

    if(byPath[p].dir && !fromTree) ne.li.classList.add("open"); }

function renderFlow(flow){
  if(!flow||!flow.length) return "";
  return `<div class="box"><h3>Schema</h3><div class="flow">${flow.map((s,i)=>
    (i?`<span class="arrow">→</span>`:"")+`<span class="step">${esc(s)}</span>`).join("")}</div></div>`;
}
function chip(p){ const n=byPath[p]; const label=p===""?"progetto":(n?n.name:p);
  return `<button class="chip" data-go="${esc(p)}" title="${esc(p)}">${esc(label)}</button>`; }
function renderCard(p){
  const n=byPath[p], I=info(p), parts=p?p.split("/"):[];
  const crumbs=[`<a data-go="">deliveBoo</a>`].concat(parts.map((s,i)=>{
    const sub=parts.slice(0,i+1).join("/"); return i===parts.length-1?`<span>${esc(s)}</span>`:`<a data-go="${esc(sub)}">${esc(s)}</a>`;}));
  let h=`<div class="card"><div class="crumbs">${crumbs.join(" / ")}</div>
   <div class="title"><h2>${esc(p?n.name:"Tutto il progetto")}</h2><span class="badge">${n.dir?"cartella":"file"}</span></div>
   <p class="lead">${esc(I.t)}</p>`;
  if(I.ex) h+=`<div class="box ex"><h3>Esempio</h3><p>${esc(I.ex)}</p></div>`;
  h+=renderFlow(I.flow);
  if(n.dir&&n.kids.length){
    h+=`<div class="box"><h3>Dentro c'è (${n.kids.length})</h3><div class="kidlist">`+n.kids.map(k=>
      `<button class="kid" data-go="${esc(k.path)}"><b>${k.dir?"▸ ":""}${esc(k.name)}</b><span>${esc(info(k.path).t)}</span></button>`).join("")+`</div></div>`;
  }
  const links=(I.links||[]).filter(x=>byPath[x]!==undefined);
  if(links.length) h+=`<div class="box"><h3>Guarda anche</h3><div class="chips">${links.map(chip).join("")}</div></div>`;
  return h+"</div>";
}

function show(v){
  ["graph","files","run"].forEach(k=>{
    document.getElementById("v-"+k).classList.toggle("on",k===v);
    document.getElementById("t-"+k).setAttribute("aria-selected",k===v);
  });
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
document.getElementById("theme").addEventListener("click",()=>{
  const r=document.documentElement, dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#1e1e1e";
  r.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("mappa-theme",r.dataset.theme)}catch(e){}
});
try{const t=localStorage.getItem("mappa-theme"); if(t)document.documentElement.dataset.theme=t;}catch(e){}

  const h=decodeURIComponent(location.hash.slice(1));
  if(location.hash.length>1&&byPath[h]!==undefined){ show("files"); select(h,false); }

})();
